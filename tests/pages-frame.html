<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub Pages 发布截图</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 34px 42px 30px;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        background:
          radial-gradient(900px 500px at 8% -10%, rgba(99, 102, 241, 0.42), transparent 62%),
          radial-gradient(900px 520px at 100% 0%, rgba(16, 185, 129, 0.18), transparent 60%),
          linear-gradient(135deg, #080b16 0%, #10142a 55%, #080b16 100%);
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }
      .left { display: flex; align-items: center; gap: 12px; }
      .gh-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        color: #0b1020;
      }
      .gh-mark svg { width: 26px; height: 26px; }
      .left strong { display: block; font-size: 17px; letter-spacing: 0.3px; }
      .left small { display: block; margin-top: 2px; color: #94a3b8; font-size: 11.5px; }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.32);
        color: #6ee7b7;
        font-size: 12px;
        font-weight: 650;
      }
      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.16);
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .browser {
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
      }
      .chrome {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        background: #f6f8fb;
        border-bottom: 1px solid #e2e8f0;
      }
      .dots { display: flex; gap: 6px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; }
      .r { background: #fda4af; }
      .y { background: #fcd34d; }
      .g { background: #6ee7b7; }
      .address {
        flex: 1;
        height: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 8px;
        padding: 0 14px;
        border-radius: 8px;
        background: #eef2f8;
        border: 1px solid #e2e8f0;
        color: #334155;
        font-size: 12.5px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }
      .lock { width: 13px; height: 13px; color: #059669; flex: 0 0 auto; }
      .pages-badge {
        flex: 0 0 auto;
        padding: 4px 10px;
        border-radius: 6px;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #047857;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      .browser img { display: block; width: 100%; height: auto; }
      .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 18px;
        color: #94a3b8;
        font-size: 12px;
      }
      .bottom b { color: #c7d2fe; font-weight: 600; }
      .checks { display: flex; gap: 18px; }
      .check { display: inline-flex; align-items: center; gap: 6px; }
      .check svg { width: 14px; height: 14px; color: #34d399; }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="left">
        <span class="gh-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.24c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.96 0-1.32.47-2.39 1.24-3.23-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.23 0 4.63-2.81 5.65-5.49 5.95.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z" />
          </svg>
        </span>
        <span>
          <strong>图提取 ImageGrab · 官网已发布</strong>
          <small>GitHub Pages · Deploy from branch · main /docs</small>
        </span>
      </div>
      <span class="live"><span class="pulse"></span> Live</span>
    </div>

    <div class="browser">
      <div class="chrome">
        <span class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></span>
        <span class="address">
          <svg class="lock" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="10" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8" />
            <path d="M8.5 10V7.8a3.5 3.5 0 0 1 7 0V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          https://peter1018-dot.github.io/imagegrab/
        </span>
        <span class="pages-badge">PAGES</span>
      </div>
      <img src="../screenshots/06-GitHubPages-raw.png" alt="GitHub Pages 官网页面" />
    </div>

    <div class="bottom">
      <span>仓库 <b>github.com/Peter1018-dot/imagegrab</b> · 部署目录 <b>/docs</b></span>
      <span class="checks">
        <span class="check">
          <svg viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
          构建状态 built
        </span>
        <span class="check">
          <svg viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
          HTTPS 已启用
        </span>
      </span>
    </div>
  </body>
</html>
