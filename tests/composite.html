<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>图提取 ImageGrab · 插件截图合集</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 34px 38px 26px;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        background:
          radial-gradient(900px 500px at 10% -10%, rgba(99, 102, 241, 0.55), transparent 60%),
          radial-gradient(800px 500px at 100% 0%, rgba(168, 85, 247, 0.35), transparent 55%),
          linear-gradient(135deg, #0b1020 0%, #151238 55%, #0b1020 100%);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #4f46e5, #7c3aed 60%, #a855f7);
        box-shadow: 0 10px 24px rgba(79, 70, 229, 0.45);
      }
      .logo svg { width: 24px; height: 24px; }
      .brand strong { display: block; font-size: 19px; letter-spacing: 1px; }
      .brand small { display: block; margin-top: 2px; color: #a5b4fc; font-size: 9.5px; letter-spacing: 2.4px; }
      .meta { color: #c7d2fe; font-size: 12px; text-align: right; line-height: 1.7; }
      .meta b { color: #fff; font-weight: 650; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
      figure { margin: 0; }
      .frame {
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 26px 60px rgba(2, 6, 23, 0.5);
      }
      .bar {
        height: 27px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 11px;
        background: #f1f5f9;
        border-bottom: 1px solid #e2e8f0;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; }
      .r { background: #fda4af; }
      .y { background: #fcd34d; }
      .g { background: #6ee7b7; }
      img { display: block; width: 100%; height: auto; }
      figcaption {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
        color: #dbeafe;
        font-size: 13px;
        font-weight: 550;
      }
      .num {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        box-shadow: 0 6px 14px rgba(79, 70, 229, 0.4);
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 22px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: #818cf8;
        font-size: 11.5px;
      }
      .footer b { color: #c7d2fe; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="#fff" stroke-width="1.7" opacity=".5" />
            <path d="M12 6.8v8.4m0 0 3.4-3.4M12 15.2 8.6 11.8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span>
          <strong>图提取 ImageGrab</strong>
          <small>CHROME EXTENSION · MANIFEST V3</small>
        </span>
      </div>
      <div class="meta">
        <b>电商图片批量下载插件</b><br />
        淘宝 / 天猫 · 京东 · 拼多多商家版
      </div>
    </div>

    <div class="grid">
      <figure>
        <div class="frame">
          <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
          <img src="../screenshots/03-插件截图-页面按钮.png" alt="商品详情页悬浮按钮" />
        </div>
        <figcaption><span class="num">01</span>商品详情页右下角「获取图片」入口</figcaption>
      </figure>

      <figure>
        <div class="frame">
          <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
          <img src="../screenshots/03-插件截图-图片画廊.png" alt="图片预览与批量下载" />
        </div>
        <figcaption><span class="num">02</span>集中预览、自由勾选、批量下载为 PNG</figcaption>
      </figure>
    </div>

    <div class="footer">
      <span>一键提取 · 智能过滤 · 集中预览 · 统一 PNG</span>
      <span><b>v1.0.0</b> · 纯本地处理，不上传页面数据</span>
    </div>
  </body>
</html>
